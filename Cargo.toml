[package]
name = "acuity-index"
version = "0.9.1"
edition = "2024"
authors = ["Jonathan Brown"]
description = "Configurable omni-indexer for Substrate blockchains."
homepage = "https://index.acuity.network/"
repository = "https://github.com/acuity-network/acuity-index"
license = "Apache-2.0"
# MSRV: the crate builds and tests on Rust 1.92.0 and newer; keep code and
# dependencies within this floor (verified against a `cargo +1.92.0
# check --all-targets` run). The workspace defaults to NIGHTLY (see
# rust-toolchain.toml) so every adhoc `cargo` command gets the fast per-profile
# `-Z` flags; stable builds are an explicit opt-out via `just build-stable` /
# `check-stable` / `test-stable`.
rust-version = "1.92.0"

[package.metadata.release]
allow-branch = ["master"]
pre-release-commit-message = "chore(release): {{version}}"
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-hook = ["bash", "./scripts/release-checks.sh"]

[features]
default = []
synthetic-tools = []

[[bin]]
name = "acuity-index"
path = "src/main.rs"

[[bin]]
name = "benchmark_synthetic_indexing"
path = "src/bin/benchmark_synthetic_indexing.rs"
required-features = ["synthetic-tools"]

[[bin]]
name = "seed_synthetic_runtime"
path = "src/bin/seed_synthetic_runtime.rs"
required-features = ["synthetic-tools"]

# Workspace root. Includes the synthetic runtime (and its pallet) so the indexer
# and the runtime share one lockfile and one resolver — no version skew between
# the runtime's trie/state-machine and the integration test's proof verification.
# The runtime is a Substrate no_std runtime built with substrate-wasm-builder.
[workspace]
members = ["runtime", "runtime/pallets/synthetic"]
resolver = "3"

# Single source of truth for the polkadot-sdk family versions. Every crate grabs
# these via `X.workspace = true`; nothing is version-pinned in a member manifest.
# `codec`/`scale-info` must be real (proc-macro) dependencies for the frame
# derives, so they live here once and stay in lockstep with the umbrella's own
# pins (the resolver unifies them).
[workspace.dependencies]
polkadot-sdk = { version = "2606.1.0", default-features = false }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }

[dependencies]
ahash = "0.8"
byte-unit = "5.2"
byteorder = "1.5"
clap = { version = "4.6", features = ["derive"] }
clap-verbosity-flag = "3"
futures = "0.3"
hex = "0.4"
home = "0.5"
notify = "6"
num-format = "0.4"
prometheus-client = "0.24"
scale-info = "2.11"
scale-value = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
sled = "0.34"
# sp-crypto-hashing is a polkadot-sdk crate kept as a DIRECT, version-pinned
# dependency (not sourced from the polkadot-sdk umbrella). It is called at
# runtime (event_hydration.rs: twox_128) and is a production dependency of the
# shipped indexer — routing it through the umbrella would pull the whole SDK
# umbrella into the shipped binary's dependency graph, which is not worth it for
# one hash function. Its version (0.1.0) happens to match the umbrella's own pin
# (the resolver unifies them to a single copy), so there is no conflict. The
# dev-only sp-* crates the integration test needs (sp-core / sp-state-machine /
# sp-trie) ARE sourced from the umbrella instead, because they never ship in the
# binary — see [dev-dependencies] below.
sp-crypto-hashing = "0.1.0"
subxt = "0.50.0"
subxt-signer = "0.50.0"
thiserror = { version = "2", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29.0"
toml = "1.1.0"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = "0.3"
zerocopy = "0.8.47"
zerocopy-derive = "0.8.47"

# The integration test verifies storage proofs against the runtime, so it needs
# the same sp-* types as the runtime. It sources them from the polkadot-sdk
# umbrella (not pinned per-crate) so the versions always match the runtime.
[dev-dependencies]
polkadot-sdk = { workspace = true, features = ["sp-core", "sp-state-machine", "sp-trie", "std"] }
subxt-lightclient = { version = "0.50.0", features = ["native"] }
tempfile = "3"

# Dev profile (the default for `cargo build` / `cargo run` / `cargo test`).
# debug = "line-tables-only": emit line tables (file:line for backtraces)
# without full debug info — cuts compile time and artifact size vs the default
# full debuginfo while still giving usable backtraces during development.
#
# rustflags (requires the [unstable] profile-rustflags opt-in in
# .cargo/config.toml; nightly-only — see rust-toolchain.toml): auto-applied to
# every adhoc `cargo` command under the nightly default toolchain, including
# `cargo build -p acuity-index` / `cargo check -p acuity-index` / `cargo nextest
# run -p acuity-index`.
# - -Zshare-generics=yes: emit each generic monomorphization once per crate
#   graph instead of once per using crate — the big dev-build win. Deliberately
#   dev-ONLY: it has a history of codegen bugs under optimization, and with no
#   LTO in the release profile there is no link-time dedup to compare against.
# - -Zunstable-options + --jobs-frontend=0: parallelize the rustc query
#   frontend across one thread per logical core (0 = available_parallelism —
#   rustc's "auto"). Self-tuning: a 2-core laptop and a 64-core box each get
#   the right pool size with no edit.
# - -C target-cpu=native: build for the LOCAL machine's CPU so every local
#   build — dev, test, and release — is tuned for the box it runs on. This is
#   the repo-wide default and deliberately NEVER reaches a shipped artifact:
#   shipped binaries use the `dist` profile, which inherits release (not dev)
#   and carries no `target-cpu=native`, so they stay on the baseline CPU.
#   KEEP THE ARRAY ON ONE LINE: build-stable.sh strips `^rustflags = [` lines
#   exactly; a multi-line array would leave dangling entries in the stripped
#   manifest and break the stable build.
[profile.dev]
debug = "line-tables-only"
rustflags = ["-Zunstable-options", "--jobs-frontend=0", "-Zshare-generics=yes", "-C", "target-cpu=native"]

# Dev-loop release profile: optimized (opt-level 3, the release default) but
# links FAST — no LTO and no single-codegen-unit serialization — so `just
# build-release` / `just benchmark-indexing` iterate quickly. The slow-link
# codegen lives only in the `dist` profile below (the shipped-artifact path).
[profile.release]

# Shipped-artifact profile (used by cargo-dist). Inherits release's opt-level
# but adds the expensive-but-optimal codegen that the release profile keeps off
# to keep local linking fast:
# - lto = "thin": cross-crate inlining/optimization at link time (slower link)
# - codegen-units = 1: serialize codegen for maximum optimization (slower compile)
# - incremental = false: no incremental cache (deterministic, smaller artifacts)
# - strip = "symbols": cut shipped size; panic messages keep their file:line
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
incremental = false
strip = "symbols"
